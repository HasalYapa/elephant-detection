[build]
  command = "npm run netlify-build"
  publish = "out"
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./"

[build.environment]
  NODE_VERSION = "18.18.0"
  NPM_VERSION = "9.8.0"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_USE_NETLIFY_FUNCTIONS = "true"
  NEXT_TYPESCRIPT_COMPILE_OPTIONS = '{"transpileOnly": true}'
  NEXT_SKIP_EXPORT_ERRORS = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect API requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Handle Next.js routing - DO NOT redirect to index.html
# Let the Next.js plugin handle routing
